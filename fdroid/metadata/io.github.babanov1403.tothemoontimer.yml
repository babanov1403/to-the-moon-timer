AuthorName: babanov1403
SourceCode: https://github.com/babanov1403/to-the-moon-timer
IssueTracker: https://github.com/babanov1403/to-the-moon-timer/issues
Changelog: https://github.com/babanov1403/to-the-moon-timer/releases

AutoName: To The Moon Timer
Summary: Retro space-themed Pomodoro timer
Description: |-
  To The Moon Timer is a Flutter Pomodoro app with a retro space theme.

  Start a focus session to launch a spaceship, fly through space, land on a
  procedurally generated pixel-art planet, then continue through breaks and the
  Pomodoro cycle. The app stores focus statistics locally and does not include
  ads, tracking, or network services.

RepoType: git
Repo: https://github.com/babanov1403/to-the-moon-timer.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
